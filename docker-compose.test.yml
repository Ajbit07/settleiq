# Postgres for local integration tests. CI uses Testcontainers instead; this
# exists because Docker Desktop on Windows exposes a named pipe that docker-java
# cannot negotiate, while the CLI can talk to the engine perfectly well.
name: settleiq-test
services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: settleiq
      POSTGRES_USER: settleiq
      POSTGRES_PASSWORD: settleiq
      LANG: C.UTF-8
    command: ["postgres", "-c", "max_locks_per_transaction=256", "-c", "fsync=off"]
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U settleiq -d settleiq"]
      interval: 3s
      timeout: 3s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data
