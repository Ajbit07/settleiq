name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "21"

jobs:
  # The synthetic data must regenerate byte-identically. If it does not, every
  # metric downstream is comparing against a different dataset than it claims to.
  datagen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate and verify integrity
        run: |
          python -m datagen --out data
          python -m datagen --profile train_t1 --out data
          python -m datagen --profile train_t2 --out data
          python -m datagen --profile train_t3 --out data
          python verify_data.py data/merchant_a data/merchant_b_ood
      - name: Assert byte-identical regeneration
        run: |
          # Hash a directory this step generated itself, not the checkout. data/
          # is committed so a clone runs without a build step, and it also holds
          # adversarial/ and hard_netting/, which come from separate make targets
          # and are not reproduced by `python -m datagen`. Hashing the checkout
          # therefore compared five profiles against seven and failed on a
          # difference that says nothing about determinism.
          rm -rf data
          python -m datagen --out data
          python -m datagen --profile train_t1 --out data
          python -m datagen --profile train_t2 --out data
          python -m datagen --profile train_t3 --out data
          find data -name '*.csv' | sort | xargs sha256sum | sha256sum > /tmp/h1
          rm -rf data
          python -m datagen --out data
          python -m datagen --profile train_t1 --out data
          python -m datagen --profile train_t2 --out data
          python -m datagen --profile train_t3 --out data
          find data -name '*.csv' | sort | xargs sha256sum | sha256sum > /tmp/h2
          diff /tmp/h1 /tmp/h2 || { echo "::error::datagen is not reproducible"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-data
          path: data/
          retention-days: 3

  # Engine tests need no Docker and no database. Kept separate so a broken
  # container runtime never hides an arithmetic regression.
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Unit tests
        run: mvn -B -pl engine test
      - name: Assert the engine has zero runtime dependencies
        run: |
          mvn -B -pl engine dependency:list -DincludeScope=runtime -DoutputFile=/tmp/deps.txt -q
          if grep -qE '^\s+[a-z].*:(compile|runtime)$' /tmp/deps.txt; then
            echo "::error::settleiq-engine gained a runtime dependency"
            cat /tmp/deps.txt
            exit 1
          fi

  integration:
    runs-on: ubuntu-latest
    needs: [engine]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: settleiq
          POSTGRES_USER: settleiq
          POSTGRES_PASSWORD: settleiq
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U settleiq -d settleiq"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Integration tests against real Postgres 16
        env:
          TEST_DB_URL: jdbc:postgresql://localhost:5432/settleiq
          TEST_DB_USER: settleiq
          TEST_DB_PASSWORD: settleiq
        run: mvn -B verify
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: failsafe-reports
          path: api/target/failsafe-reports/

  # The end-to-end numbers in the README are regenerated and checked, so the
  # documentation cannot drift away from what the code actually does.
  evaluate:
    runs-on: ubuntu-latest
    needs: [datagen, engine]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: synthetic-data
          path: data/
      - name: Build engine classes
        run: |
          mkdir -p engine/out
          javac -d engine/out $(find engine/src/main/java -name '*.java')
      - name: Train scorer and evaluate
        run: |
          for m in train_t1 train_t2 train_t3 merchant_a; do
            java -cp engine/out com.settleiq.Main --merchant data/$m --preset full \
              --out reports/$m --audit reports/tmp_$m.jsonl \
              --dump-candidates reports/$m/candidates.csv > /dev/null
          done
          python mlservice/train.py
          rm -f reports/audit_ledger.jsonl
          java -cp engine/out com.settleiq.Main --merchant data/merchant_a --preset full --out reports
          python evaluator/evaluate.py data/merchant_a full reports/full | tee /tmp/eval.txt
          python evaluator/ablate.py data/merchant_a
          python evaluator/curves.py data/merchant_a reports/full
      - name: Gate on the money metric
        run: |
          python - <<'PY'
          import json, sys
          m = json.load(open("reports/metrics/full.json"))
          fm = m["auto_false_match_rate"] * 100
          missed = m["ambiguous_missed"]
          print(f"false-match rate {fm:.4f}%  ambiguous missed {missed}")
          fail = []
          if fm >= 0.5:
              fail.append(f"false-match rate {fm:.4f}% exceeds the 0.5% budget")
          if missed > 0:
              fail.append(f"{missed} swap-invariant payments were auto-matched")
          if fail:
              print("::error::" + "; ".join(fail)); sys.exit(1)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: metrics
          path: reports/metrics/

  images:
    runs-on: ubuntu-latest
    needs: [integration]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ops/Dockerfile.api
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build ML image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ops/Dockerfile.ml
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
